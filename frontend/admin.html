<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel | AI Project Tracker</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="js/admin.js" defer></script>
  <script src="js/commonnavbar.js" defer></script>
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <a href="projects.html">
      <img src="images/logo.png" class="logo-img">
    </a>
    <h1>AI Project Tracker</h1>
  </div>

  <div class="navbar-user">
    <span>👋 Welcome <span id="userName">Admin</span></span>
    <img src="images/user.png" class="user-avatar" id="profileBtn">
      
    <!-- LOGOUT -->
      <a href="#" id="logoutBtn" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
  </div>
</nav>

<main class="dashboard">

  <section class="dashboard-grid">
    <div class="card">
      <h3>Total Users</h3>
      <h2 id="totalUsers">0</h2>
    </div>

    <div class="card">
      <h3>Total Projects</h3>
      <h2 id="totalProjects">0</h2>
    </div>

    <div class="card">
      <h3>Total Tasks</h3>
      <h2 id="totalTasks">0</h2>
    </div>
  </section>

  <!-- USERS -->
  <section class="card">
    <h3>All Users</h3>

    <input type="text" id="userSearch" class="admin-search" placeholder="Search users...">

    <table class="admin-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="usersTable"></tbody>
    </table>
  </section>

  <!-- PROJECTS -->
  <section class="card">
    <h3>All Projects</h3>

    <input type="text" id="projectSearch" class="admin-search" placeholder="Search projects...">

    <table class="admin-table">
      <thead>
        <tr>
          <th>Project</th>
          <th>Owner</th>
          <th>Deadline</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="projectsTable"></tbody>
    </table>
  </section>

  <!-- 🔥 NEW: CONTACT MESSAGES -->
  <section class="card">
    <h3>Contact Messages</h3>

    <table class="admin-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="contactTable"></tbody>
    </table>
  </section>

</main>

<!-- EDIT MODAL -->
<div id="editModal" class="modal">
  <div class="modal-content">

    <h2>Edit Project</h2>

    <input type="text" id="editName" placeholder="Project Name">
    <input type="date" id="editDeadline">

    <select id="editStatus">
      <option value="Pending">Pending</option>
      <option value="In Progress">In Progress</option>
      <option value="Completed">Completed</option>
      <option value="Delayed">Delayed</option>
    </select>

    <div class="modal-actions">
      <button id="saveEdit">Save</button>
      <button id="closeModal">Cancel</button>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<footer class="footer">
  <p>© 2025 AI Project Tracker for Architecture| Admin Panel</p>
</footer>


</body>
</html>
