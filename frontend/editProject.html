<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Project</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">
      <a href="projects.html">
        <img src="images/logo.png" class="logo-img">
      </a>
      <h1>AI Project Tracker</h1>
    </div>

    <div class="navbar-user">
      <span>👋 Welcome <span id="userName">User</span></span>

      <a href="profile.html">
        <img src="https://i.pravatar.cc/40" class="user-avatar">
      </a>

      <a href="#" id="logoutBtn">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
    </div>
  </nav>

  <main>
    <section class="form-container">

      <h2>Edit Project</h2>

      <form id="editForm">

        <label>Project Name</label>
        <input type="text" id="name" placeholder="Project Name" required>

        <label>Description</label>
        <textarea id="description" placeholder="Description"></textarea>

        <label>Deadline</label>
        <input type="date" id="deadline">

        <!-- ✅ FIXED STATUS -->
        <label>Status</label>
        <select id="status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="Delayed">Delayed</option>
        </select>

        <label>Update Image</label>
        <input type="file" id="image">

        <button type="submit">Update Project</button>

      </form>

    </section>
  </main>

  <footer>
    <ul class="nav-links">
      <li><a href="projects.html">Projects</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <p>© 2025 AI Project Tracker for Architecture</p>
  </footer>

  <script src="js/editProject.js"></script>
  <script src="js/commonnavbar.js"></script>



</body>
</html>
