<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Tasks</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar">
  <div class="logo">
    <!-- 🔥 FIX: Unique ID -->
    <a id="logoLink">
      <img src="images/logo.png" class="logo-img">
    </a>
    <h1>AI Project Tracker</h1>
  </div>

  <ul class="nav-links">
    <!-- 🔥 FIX: Unique IDs -->
    <li><a id="dashboardNavLink">Dashboard</a></li>
    <li><a id="addTaskNav">Add Task</a></li>
    <li><a id="manageTaskNav" class="active">Manage Tasks</a></li>
  </ul>

  <div class="navbar-user">
    <span>👋 Welcome <span id="userName">User</span></span>

   <a href="profile.html">
        <img src="https://i.pravatar.cc/40" class="user-avatar">
      </a>

    <a href="#" id="logoutBtn">
      <i class="fas fa-sign-out-alt"></i>
    </a>
  </div>
</nav>

<!-- ================= MAIN ================= -->
<section class="manage-container">

  <h2>Manage Tasks</h2>

  <!-- ================= FILTER ================= -->
  <div class="filters">
    <button onclick="filterTasks('all')">All</button>
    <button onclick="filterTasks('Pending')">Pending</button>
    <button onclick="filterTasks('In Progress')">In Progress</button>
    <button onclick="filterTasks('Completed')">Completed</button>
  </div>

  <!-- ================= TASK LIST ================= -->
  <div id="taskContainer" class="task-list"></div>

</section>

<!-- ================= SCRIPTS ================= -->
<script src="js/commonnavbar.js"></script>
<script src="js/manageTasks.js"></script>

</body>
</html>
